[build-system]
requires = [
    "flit_core >=3.9,<3.12; python_version < '3.8'",
    "flit_core >=3.12,<4; python_version >= '3.8'",
]
build-backend = "flit_core.buildapi"

[project]
name="ansys-scade-ps"
version="0.3.dev0"
description ="Collection of command-line scripts for SCADE."
readme="README.rst"

# only 3.7, 3.10, or >= 3.12
requires-python = ">=3.7,!=3.8.*,!=3.9.*,!=3.11.*"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ANSYS, Inc.", email = "pyansys.core@ansys.com"}]
maintainers = [{name = "ANSYS, Inc.", email = "pyansys.core@ansys.com"}]
classifiers=[
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies=[
    "importlib-metadata >= 1.0; python_version < '3.8'",
    "importlib-metadata >= 4.0; python_version >= '3.8'",
    "ansys-scade-apitools >= 0.5.0",
    "lxml",
]
keywords=["Scade", "script", "python"]

[project.optional-dependencies]
build = [
    "build==1.4.1",
    "twine==6.2.0"
]
tests = [
    "pytest >= 9.0.1; python_version >= '3.8'",
    "pytest <= 7.4.4; python_version < '3.8'",
    "pytest-cov == 7.0.0; python_version >= '3.8'",
    "pytest-cov <= 4.1.0; python_version < '3.8'",
]
doc = [
    "ansys-sphinx-theme[autoapi]==1.7.0; python_version >= '3.12'",
    "ansys-sphinx-theme[autoapi]==1.5.2; python_version <= '3.10'",
    "numpydoc==1.9.0",
    "sphinx==9.1.0; python_version >= '3.12'",
    "sphinx==8.1.3; python_version <= '3.10'",
    "sphinx-copybutton==0.5.2",
    "sphinx-design===0.7.0; python_version >= '3.12'",
    "sphinx-design===0.6.1; python_version <= '3.10'",
]

[project.scripts]
ansys_scade_ps_obfuscator = "ansys.scade.ps.obfuscator.__main__:main"
ansys_scade_ps_default_notes = "ansys.scade.ps.default_notes.__main__:main"
ansys_scade_ps_copy_properties = "ansys.scade.ps.copy_properties.__main__:main"
ansys_scade_ps_rename_unused = "ansys.scade.ps.rename_unused.__main__:main"
ansys_scade_ps_change_oids = "ansys.scade.ps.change_oids.__main__:main"
ansys_scade_ps_optimize_sss = "ansys.scade.ps.optimize_sss.__main__:main"

[project.urls]
source = "https://github.com/ansys/scade-ps"
issues = "https://github.com/ansys/scade-ps/issues"
discussions = "https://github.com/ansys/scade-ps/discussions"
documentation = "https://ps.scade.docs.pyansys.com"
releases = "https://github.com/ansys/scade-ps/releases"
homepage = "https://www.ansys.com/products/embedded-software/ansys-scade-suite"

[tool.flit.module]
name = "ansys.scade.ps"

[tool.ruff]
line-length = 100
fix = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
exclude = [
    # (partially) generated files: need manual review
    "scenario.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle, see https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "D",    # pydocstyle, see https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "F",    # pyflakes, see https://docs.astral.sh/ruff/rules/#pyflakes-f
    "I",    # isort, see https://docs.astral.sh/ruff/rules/#isort-i
    "N",    # pep8-naming, see https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "PTH",  # flake8-use-pathlib, https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "TD",   # flake8-todos, https://docs.astral.sh/ruff/rules/#flake8-todos-td
]
exclude = [
    # (partially) generated files: need manual review
    "scenario.py",
]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["ansys", "conftest", "test_utils"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D",]

[tool.coverage.run]
source = ["ansys.scade.ps"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "@(abc\\.)?abstractmethod",
]

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "-ra --cov=ansys.scade.ps --cov-report html:.cov/html --cov-branch --cov-report xml:.cov/xml --cov-report term -vv"

[tool.numpydoc_validation]
checks = [
    'GL06',  # Found unknown section
    'GL07',  # Sections are in the wrong order.
    'GL08',  # The object does not have a docstring
    'GL09',  # Deprecation warning should precede extended summary
    'GL10',  # reST directives {directives} must be followed by two colons
    'SS01',  # No summary found
    'SS02',  # Summary does not start with a capital letter
    'SS03',  # Summary does not end with a period
    'SS04',  # Summary contains heading whitespaces
    # "SS05", # Summary must start with infinitive verb, not third person
    'RT02',  # The first line of the Returns section should contain only the
    # type, unless multiple values are being returned"
]
exclude = [
    '\._',  # ignore private definitions
    'conftest.',
    'test.',
    # generated files
    "scenario.",
]

[tool.towncrier]
package = "ansys.scade.ps"
directory = "doc/changelog.d"
filename = "doc/source/changelog.rst"
start_string = ".. towncrier release notes start\n"
template = "doc/changelog.d/changelog_template.jinja"
title_format = "`{version} <https://github.com/ansys/scade-ps/releases/tag/v{version}>`_ - {project_date}"
issue_format = "`#{issue} <https://github.com/ansys/scade-ps/pull/{issue}>`_"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "maintenance"
name = "Maintenance"
showcontent = true

[[tool.towncrier.type]]
directory = "miscellaneous"
name = "Miscellaneous"
showcontent = true

[[tool.towncrier.type]]
directory = "test"
name = "Test"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[tool.codespell]
ignore-words-list = ["synopsys"]

